split: dev
formatter:
  _target_: pytod.text_formatter.TextFormatter
  user_name: user
  system_name: agent
  index_user_turns: true
  service_call_formatter:
    _target_: pytod.text_formatter.PythonFunctionServiceCallFormatter
    format_config: ${...service_calls_text}
  service_results_formatter:
    _target_: pytod.text_formatter.SGDServiceCallResultFormatter
    format_config: ${...service_results_text}
  command_collection:
    _target_: pytod.command.CommandCollection
    schema_path: ${root:data/raw/sgd/${...split}}/schema.json
service_results_text:
  prefix: 'results: '
  error_prefix: 'error: '
  index_results: true
  filtering_opts:
    call_params: true
    opt_slots: true
service_calls_text:
  convert_camel_case: true
conversation_builder:
  api_errors:
    default_message: Reservation could not be completed.
    default_search_message: No other results found.
    messages:
      Alarm_1:
        AddAlarm: Sorry, the alarm could not be set.
        GetAlarms: No other alarms found.
      Banks_1:
        CheckBalance: Access denied, account cannot be accessed at this time.
      Banks_2: ${.Banks_1}
      Buses_1:
        BuyBusTicket: ${...default_message}
      Buses_2: ${.Buses_1}
      Buses_3: ${.Buses_1}
      Calendar_1:
        GetEvents: ${...default_search_message}
        GetAvailableTime: No other time available.
      Events_1:
        FindEvents: ${...default_search_message}
        BuyEventTickets: ${...default_message}
      Events_2:
        FindEvents: ${..Events_1.FindEvents}
        BuyEventTickets: ${..Events_1.BuyEventTickets}
        GetEventDates: There are no other dates available.
      Events_3: ${.Events_1}
      Flights_1:
        SearchOnewayFlight: ${...default_search_message}
        SearchRoundtripFlights: ${.SearchOnewayFlight}
        ReserveOnewayFlight: ${...default_message}
        ReserveRoundtripFlights: ${...default_message}
      Flights_2:
        SearchOnewayFlight: ${..Flights_1.SearchOnewayFlight}
        SearchRoundtripFlights: ${.SearchOnewayFlight}
      Flights_3: ${.Flights_2}
      Flights_4: ${.Flights_2}
      Homes_1:
        FindApartment: ${...default_search_message}
        ScheduleVisit: Appointment could not be scheduled.
      Hotels_1:
        ReserveHotel: ${...default_message}
      Hotels_2:
        BookHouse: ${...default_message}
      Hotels_3: ${.Hotels_1}
      Hotels_4:
        SearchHotel: ${...default_search_message}
        ReserveHotel: ${...default_message}
      Media_1:
        FindMovies: ${...default_search_message}
        PlayMovie: There was an error while trying to play the movie.
      Media_2:
        FindMovies: ${...default_search_message}
        RentMovie: Transaction did not succeed.
      Media_3: ${.Media_1}
      Movies_1:
        GetTimesForMovie: No other time available.
        FindMovies: ${...default_search_message}
        BuyMovieTickets: Transaction did not succeed.
      Movies_2:
        FindMovies: ${..Movies_1.FindMovies}
      Movies_3: ${.Movies_2}
      Music_1:
        LookupSong: ${...default_search_message}
      Music_2:
        LookupMusic: ${...default_search_message}
      Music_3: ${.Music_2}
      RentalCars_1:
        GetCarsAvailable: No other options available.
        ReserveCar: ${...default_message}
      RentalCars_2:
        GetCarsAvailable: ${..RentalCars_1.GetCarsAvailable}
        ReserveCar: ${...default_message}
      RentalCars_3:
        ReserveCar: ${..RentalCars_2.ReserveCar}
      Restaurants_1:
        FindRestaurants: ${...default_search_message}
        ReserveRestaurant: ${...default_message}
      Restaurants_2: ${.Restaurants_1}
      RideSharing_1:
        GetRide: No ride was found.
      RideSharing_2: ${.RideSharing_1}
      Services_1:
        FindProvider: No service provider could be found.
        BookAppointment: ${...default_message}
      Services_2: ${.Services_1}
      Services_3: ${.Services_1}
      Services_4: ${.Services_1}
      Travel_1:
        FindAttractions: ${...default_search_message}
      Weather_1:
        GetWeather: An error occurred while retrieving information.
  builder:
    _target_: pytod.sgd_conversation_builder.build_conversation
    _partial_: true
    _convert_: object
    error_messages: ${..api_errors.messages}
