# This file is used to configure your project.
# Read more about the various options under:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
# https://setuptools.pypa.io/en/latest/references/keywords.html

[metadata]
name = pytod
description = Add a short description here!
author = Alexandru Coca
author_email = ac2123@cam.ac.uk
license = MIT
license_files = LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8; variant=GFM
url = https://github.com/pyscaffold/pyscaffold/
# Add here related links, for example:
project_urls =
    Documentation = https://pyscaffold.org/
#    Source = https://github.com/pyscaffold/pyscaffold/
#    Changelog = https://pyscaffold.org/en/latest/changelog.html
#    Tracker = https://github.com/pyscaffold/pyscaffold/issues
#    Conda-Forge = https://anaconda.org/conda-forge/pyscaffold
#    Download = https://pypi.org/project/PyScaffold/#files
#    Twitter = https://twitter.com/PyScaffold

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

# Require a min/specific Python version (comma-separated conditions)
python_requires = >=3.10

# Add here dependencies of your project (line-separated), e.g. requests>=2.2,<3.0.
# Version specifiers like >=2.2,<3.0 avoid problems due to API changes in
# new major versions. This works if the required packages follow Semantic Versioning.
# For more information, check out https://semver.org/.
install_requires =
    absl-py >= 1.0.0, <2.0.0
    accelerate==0.24.1, <1.2.0
    aiohttp>=3.12.14
    bitsandbytes>=0.41.0, <0.42.0
    click == 8.1.3
    datasets>=2.15.0, <3.0.0
    diskcache >= 5.4.0, <6.0.0
    fuzzywuzzy[speedup]>=0.18.0, <1.0.0
    hydra-core >= 1.3.2, <1.4.0
    importlib-resources>=5.1.2, <6.0.0
    Jinja2 >= 3.1.6, <4.0.0
    mongoquery >= 1.4.2, <1.5.0
    numpy>=1.26.2, <2.0.0
    omegaconf >= 2.1.2, <3.0.0
    prettyprinter>=0.18.0, <1.0.0
    pydantic >= 2.5.1, <3.0.0
    python-dotenv >=1.0.0, <2.0.0
    python-Levenshtein>=0.12.2, <1.0.0
    requests>=2.32.4
    rich >= 13.5.2, <14.0.0
    sentencepiece>=0.1.96, <1.0.0
    tqdm >= 4.64.1, <5.0.0
    transformers>=4.48.0
    urllib3>=2.5.0
;package_data =
;    pytod = configs/**/*

[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install pytod[PDF]` like:
# PDF = ReportLab; RXP

# Add here test requirements (semicolon/line-separated)
testing =
    setuptools
    pytest
    pytest-cov
wandb =
    wandb >= 0.13.11, <0.14.0


[options.entry_points]
# Add here console scripts like:
# console_scripts =
#     script_name = pytod.module:function
# For example:
# console_scripts =
#     fibonacci = pytod.skeleton:run
console_scripts =
    display_pytod = pytod.apps.display_pytod_transcript:display_pytod_transcript
    read_feedback = pytod.apps.read_feedback:read_feedback
    query_feedback = pytod.apps.read_feedback:query_feedback
    display_metrics = pytod.apps.display_metrics:display_metrics


# And any other entry points, for example:
# pyscaffold.cli =
#     awesome = pyscaffoldext.awesome.extension:AwesomeExtension

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
;    --cov pytod --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
markers =
     slow: mark tests as slow (deselect with '-m "not slow"')
     system: mark end-to-end system tests
     local: mark tests as local only (to deselect tests that are data dependent)
log_cli = True

[bdist_wheel]
# Use this option if your package is pure-python
universal = 1

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 100
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py
    .git
    .mypy_cache
    .pytest_cache
    .venv
    __pycache__
    build
    dist
    out
    venv
ignore =
  # This line causes flake8 to ignore all errors/warnings generated by pycodestyle. Uncomment if you would
  # like to enable stylistic checks.
  E,W,

  # Do not mandate docstrings
  # See: http://www.pydocstyle.org/en/latest/error_codes.html#grouping
  D100, D101, D102, D103, D104, D105, D106, D107, D401

  # Allow f-strings without any placeholders (this can be considered a stylistic choice)
  F541,
per-file-ignores =
    src/pytod/summarisation_prompts.py:E501
    src/pytod/_in_development_prompts.py:E501
    src/pytod/_scratch_rich_display:F821
    src/pytod/__init__.py:E402
    scripts/scratches/_scratch_llm_inference.py:E501
[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.4.1
package = pytod
extensions =
    dsproject
    github_actions
    no_skeleton
    pre_commit
